name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"

      # The version here must match pyproject.toml, .python-version and the
      # Dockerfile. Drift between them is the bug this pin exists to prevent.
      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install
        run: uv sync --locked --all-groups

      - name: Test
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t boxd-bridge:ci .
      - name: Container refuses to start without a configured source
        run: |
          if docker run --rm -e AUTH_MODE=env boxd-bridge:ci \
              python -c "from boxd_bridge.config import Settings; Settings(_env_file=None)"; then
            echo "expected a ConfigError but the app accepted an empty config"
            exit 1
          fi
      - name: Container runs as non-root
        run: |
          uid=$(docker run --rm boxd-bridge:ci id -u)
          test "$uid" != "0" || { echo "container is running as root"; exit 1; }
