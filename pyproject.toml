[project]
name = "boxd-bridge"
version = "0.1.0"
description = "Export Plex / Tautulli watch history to a Letterboxd-importable CSV."
readme = "README.md"
license = { text = "MIT" }
requires-python = "==3.14.*"
dependencies = [
    "fastapi>=0.136.1,<0.137",
    "uvicorn[standard]>=0.38.0,<0.39",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.12.0,<3",
    "pydantic-settings>=2.11.0,<3",
    "cryptography>=49.0.0,<50",
    "jinja2>=3.1.6,<4",
]

[project.urls]
Homepage = "https://github.com/pete-builds/boxd-bridge"

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9",
    "pytest-asyncio>=1.0.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boxd_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-q"
